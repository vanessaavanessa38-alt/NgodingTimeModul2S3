<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <title>White-space Property</title>
        <style type="text/css" media="all">
            p.pre {white-space: pre;}
            p.nowrap {white-space: nowrap;}
        </style>
    </head>
    <body>
        <P>This is a standard paragraph
                    notice
                          that white 
                        space
                        is not preserved.
        </P>
        <P class="pre">This paragraph
                    had
                    it's    white-space
            rules       adjusted to
                    act
                    like  a 
                                        pre element.
        </P>
        <p class="nowrap">This very long paragraph really ought to wrap but
            it deosn't because the nowrap value has been set for the white-space property.
        </p>
    </body>
</html>
